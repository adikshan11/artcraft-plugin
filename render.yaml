services:
  - type: web
    name: artcraft-storytold-mcp
    runtime: docker
    # Video processing needs more than the free plan's 512 MB for long clips;
    # move to a paid instance before promoting video editing publicly.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://artcraft-storytold-mcp.onrender.com
      # OAuth (Auth0 or Clerk). See README "ArtCraft Studio".
      - key: OAUTH_ISSUER
        sync: false
      - key: OAUTH_AUDIENCE
        sync: false
      # S3-compatible storage for user files (Backblaze B2 shown; R2_* also works).
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
