name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # Same system packages as the Dockerfile: FFmpeg for the video tests,
      # DejaVu fonts for image and video captions.
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Render deploys from this Dockerfile, so make sure it still builds.
      - name: Build image
        run: docker build -t artcraft-plugin .

      # The Craft apps are only installed inside the image, so run the
      # real-app checks there.
      - name: Test real Craft apps in the image
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" artcraft-plugin \
            python -m unittest tests.test_craft_real -v
