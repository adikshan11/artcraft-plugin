<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{% block description %}{% endblock %}" />
    <link rel="canonical" href="{{ site_url }}{{ request.path }}" />
    <link rel="icon" href="{{ icon_url }}" type="image/svg+xml" />
    <title>{% block title %}{% endblock %} · ArtCraft Plugin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}" aria-label="ArtCraft Plugin home">
        <img src="{{ icon_url }}" alt="" />
        <span>ArtCraft</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ url_for('privacy') }}">Privacy</a>
        <a href="{{ url_for('terms') }}">Terms</a>
        <a href="{{ url_for('support') }}">Support</a>
      </nav>
      <a class="header-link" href="{{ project_url }}" target="_blank" rel="noopener noreferrer">
        View source <span aria-hidden="true">↗</span>
      </a>
    </header>

    <main class="legal page-width">
      <h1>{{ self.title() }}</h1>
      <p class="legal-updated">Last updated {{ last_updated }}</p>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer page-width">
      <a class="brand footer-brand" href="{{ url_for('index') }}">
        <img src="{{ icon_url }}" alt="" />
        <span>ArtCraft</span>
      </a>
      <p>© 2026 Adithya Shankaran · Apache-2.0 ·
        <a href="{{ url_for('privacy') }}">Privacy</a> ·
        <a href="{{ url_for('terms') }}">Terms</a> ·
        <a href="{{ url_for('support') }}">Support</a></p>
      <a href="{{ project_url }}" target="_blank" rel="noopener noreferrer">Source on GitHub ↗</a>
    </footer>
  </body>
</html>
