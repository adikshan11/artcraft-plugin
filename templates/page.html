<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{% block description %}{% endblock %}" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f1e7" />
    <link rel="canonical" href="{{ site_url }}{{ request.path }}" />
    <link rel="icon" href="{{ url_for('static', filename='bridgecraft.svg') }}" type="image/svg+xml" />
    <title>{% block title %}{% endblock %} · BridgeCraft</title>
{% include "_theme.html" %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
{% include "_nav.html" %}

    {% block main %}
    <main class="legal">
      <h1>{{ self.title() }}</h1>
      <p class="legal-updated">Last updated {{ last_updated }}</p>
      {% block content %}{% endblock %}
    </main>
    {% endblock %}

{% include "_footer.html" %}
  </body>
</html>
